name: lean_di_workspace

environment:
  sdk: "^3.11.0"

dev_dependencies:
  melos: 7.4.0

workspace:
  - packages/lean_di
  - packages/flutter_lean_di
  - packages/flutter_lean_di/example
  - packages/flutter_lean_di_bloc
  - packages/flutter_lean_di_bloc/example
  - examples/*

melos:
  scripts:
    analyze:
      exec: dart analyze .

    format:
      exec: dart format --output=none --set-exit-if-changed .

    test:dart:
      exec: dart test
      packageFilters:
        flutter: false
        dirExists: test

    test:flutter:
      exec: flutter test
      packageFilters:
        flutter: true
        dirExists: test

    test:
      run: melos run test:dart && melos run test:flutter
