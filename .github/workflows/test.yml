name: test

on:
  pull_request:

jobs:
  test:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [format, analyze, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Add melos to PATH
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/usr/bin/env bash\nexec dart run melos "$@"\n' > "$RUNNER_TEMP/bin/melos"
          chmod +x "$RUNNER_TEMP/bin/melos"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - run: melos run ${{ matrix.task }}
